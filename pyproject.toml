[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-companion"
version = "0.1.0"
description = "Fraud case companion agent: consumes case.created events and drafts an analyst brief."
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3",
    "langchain-google-genai>=4.0.0",
    "langgraph>=0.2",
    "confluent-kafka>=2.5",
    "pydantic>=2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
